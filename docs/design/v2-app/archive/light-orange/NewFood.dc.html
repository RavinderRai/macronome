<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New food from a label</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#121311;text-decoration:none}a:hover{color:#C43D0A}
.mono{font-family:'Geist Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.cap{font-family:'Geist Mono',ui-monospace,Menlo,monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.num{font-family:'Geist Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #FF5B1F;outline-offset:2px}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0D0E0C; color: #121311; font-family: Geist, 'Helvetica Neue', Arial, sans-serif">

  <section aria-label="New food" style="position: absolute; left: 0; right: 0; top: 44px; bottom: 0; background: #FBFBF9; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; padding: 0 20px 20px">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #CFD0CA; margin-top: 8px"></span>
    <div style="height: 48px; display: flex; align-items: center; justify-content: space-between; margin-right: -10px">
      <span class="cap" style="color: #686B64">New food · from the label</span>
      <a href="LabelScan.dc.html" aria-label="Back to camera" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <label for="food-name" class="cap" style="color: #686B64; padding-top: 4px">Name</label>
    <input id="food-name" value="Field Roast spicy chipotle sausage" style="margin-top: 6px; height: 48px; box-sizing: border-box; border: 0; border-bottom: 1px solid #121311; background: transparent; font: inherit; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: #121311; padding: 0">

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 0 10px">
      <span class="cap" style="color: #686B64">Per 1 sausage</span>
      <span class="cap" style="color: #686B64">As printed</span>
    </div>

    <div style="display: flex; flex-direction: column; border-top: 1px solid #DEDFD9">
      <div style="display: flex; align-items: center; height: 52px; border-bottom: 1px solid #DEDFD9"><label for="n-kcal" style="flex: 1; font-size: 15px; font-weight: 500">Calories</label><input id="n-kcal" class="num" value="240" style="width: 80px; height: 40px; border: 0; background: transparent; text-align: right; font-size: 17px; color: #121311"></div>
      <div style="display: flex; align-items: center; height: 52px; border-bottom: 1px solid #DEDFD9"><label for="n-p" style="flex: 1; font-size: 15px; font-weight: 500; color: #C43D0A">Protein</label><input id="n-p" class="num" value="28 g" style="width: 80px; height: 40px; border: 0; background: transparent; text-align: right; font-size: 17px; color: #121311"></div>
      <div style="display: flex; align-items: center; height: 52px; border-bottom: 1px solid #DEDFD9"><label for="n-c" style="flex: 1; font-size: 15px; font-weight: 500">Carbs</label><input id="n-c" class="num" value="9 g" style="width: 80px; height: 40px; border: 0; background: transparent; text-align: right; font-size: 17px; color: #121311"></div>
      <div style="display: flex; align-items: center; height: 52px; border-bottom: 1px solid #DEDFD9"><label for="n-fb" style="flex: 1; font-size: 15px; font-weight: 500; padding-left: 14px; color: #575A54">of which fiber</label><input id="n-fb" class="num" value="2 g" style="width: 80px; height: 40px; border: 0; background: transparent; text-align: right; font-size: 17px; color: #121311"></div>
      <div style="display: flex; align-items: center; height: 52px; border-bottom: 1px solid #DEDFD9"><label for="n-f" style="flex: 1; font-size: 15px; font-weight: 500">Fat</label><input id="n-f" class="num" value="10 g" style="width: 80px; height: 40px; border: 0; background: transparent; text-align: right; font-size: 17px; color: #121311"></div>
    </div>

    <p style="margin: 14px 0 0; font-size: 14px; line-height: 1.45; color: #3B3D38">This label counts fiber at full calories, so it's logged as <span class="mono">236</span>. Everything else printed on the label is saved too.</p>

    <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 18px">
      <span class="cap" style="color: #686B64">Also answers to</span>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <span class="mono" style="height: 32px; padding: 0 12px; border-radius: 16px; background: #E9EAE4; display: flex; align-items: center; font-size: 13px">field roast</span>
        <span class="mono" style="height: 32px; padding: 0 12px; border-radius: 16px; background: #E9EAE4; display: flex; align-items: center; font-size: 13px">chipotle sausage</span>
        <span class="mono" style="height: 32px; padding: 0 12px; border-radius: 16px; background: #E9EAE4; display: flex; align-items: center; font-size: 13px">sausage</span>
      </div>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="flex: 1; font-size: 15px; font-weight: 500">Log now</span>
        <button type="button" aria-label="Fewer" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D3D4CE; background: transparent; color: #121311; font-size: 20px">−</button>
        <span class="mono" style="min-width: 88px; text-align: center; font-size: 15px">1 sausage</span>
        <button type="button" aria-label="More" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D3D4CE; background: transparent; color: #121311; font-size: 20px">+</button>
      </div>
      <div style="display: flex; gap: 8px">
        <a href="Foods.dc.html" style="flex: 1; height: 52px; border-radius: 26px; border: 1px solid #121311; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Save only</a>
        <a href="Main.dc.html" style="flex: 1.4; height: 52px; border-radius: 26px; background: #121311; color: #F2F2EE; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Save and log</a>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
