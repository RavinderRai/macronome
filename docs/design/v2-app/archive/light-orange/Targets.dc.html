<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Targets and diet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#121311;text-decoration:none}a:hover{color:#C43D0A}
.mono{font-family:'Geist Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.cap{font-family:'Geist Mono',ui-monospace,Menlo,monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.field::placeholder{color:#7F827A}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #FF5B1F;outline-offset:2px}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 0 20px 24px; display: flex; flex-direction: column; background: #F2F2EE; color: #121311; font-family: Geist, 'Helvetica Neue', Arial, sans-serif">

  <div style="height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; margin: 0 -10px">
    <a href="Welcome.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span class="cap" style="color: #686B64; padding-right: 10px">Step 1 of 2</span>
  </div>

  <h1 style="margin: 4px 0 6px; font-size: 30px; font-weight: 600; letter-spacing: -0.03em">Your daily numbers</h1>
  <p style="margin: 0 0 18px; font-size: 15px; color: #575A54">Change them any time. A one-day change never touches these.</p>

  <div style="display: flex; flex-direction: column; border-top: 1px solid #DEDFD9">
    <div style="display: flex; align-items: center; gap: 8px; height: 68px; border-bottom: 1px solid #DEDFD9">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="cap" style="color: #686B64">Calories</span><span style="font-size: 30px; font-weight: 500; letter-spacing: -0.03em">1,700<span class="mono" style="font-size: 13px; letter-spacing: 0; color: #575A54"> kcal</span></span></span>
      <button type="button" aria-label="Lower calories" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D3D4CE; background: transparent; color: #121311; font-size: 20px">−</button>
      <button type="button" aria-label="Raise calories" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D3D4CE; background: transparent; color: #121311; font-size: 20px">+</button>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 68px; border-bottom: 1px solid #DEDFD9">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="cap" style="color: #C43D0A">Protein</span><span style="font-size: 30px; font-weight: 500; letter-spacing: -0.03em">165<span class="mono" style="font-size: 13px; letter-spacing: 0; color: #575A54"> g</span></span></span>
      <button type="button" aria-label="Lower protein" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D3D4CE; background: transparent; color: #121311; font-size: 20px">−</button>
      <button type="button" aria-label="Raise protein" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D3D4CE; background: transparent; color: #121311; font-size: 20px">+</button>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 68px; border-bottom: 1px solid #DEDFD9">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="cap" style="color: #686B64">Carbs</span><span style="font-size: 30px; font-weight: 500; letter-spacing: -0.03em">159<span class="mono" style="font-size: 13px; letter-spacing: 0; color: #575A54"> g</span></span></span>
      <button type="button" aria-label="Lower carbs" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D3D4CE; background: transparent; color: #121311; font-size: 20px">−</button>
      <button type="button" aria-label="Raise carbs" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D3D4CE; background: transparent; color: #121311; font-size: 20px">+</button>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 68px; border-bottom: 1px solid #DEDFD9">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="cap" style="color: #686B64">Fat</span><span style="font-size: 30px; font-weight: 500; letter-spacing: -0.03em">45<span class="mono" style="font-size: 13px; letter-spacing: 0; color: #575A54"> g</span></span></span>
      <button type="button" aria-label="Lower fat" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D3D4CE; background: transparent; color: #121311; font-size: 20px">−</button>
      <button type="button" aria-label="Raise fat" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D3D4CE; background: transparent; color: #121311; font-size: 20px">+</button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 64px; border-bottom: 1px solid #DEDFD9">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Count carbs as net</span><span style="font-size: 13px; color: #686B64">Fiber comes off and is tracked on its own</span></span>
      <button type="button" role="switch" aria-checked="true" aria-label="Count carbs as net" style="width: 52px; height: 32px; border-radius: 16px; border: 0; background: #121311; padding: 3px; display: flex; justify-content: flex-end"><span style="width: 26px; height: 26px; border-radius: 13px; background: #F2F2EE"></span></button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 20px">
    <span class="cap" style="color: #686B64">How you eat</span>
    <div style="display: flex; gap: 8px">
      <button type="button" aria-pressed="true" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: #121311; color: #F2F2EE; font-size: 14px; font-weight: 600">Vegan</button>
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #D3D4CE; background: transparent; color: #121311; font-size: 14px; font-weight: 500">Vegetarian</button>
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #D3D4CE; background: transparent; color: #121311; font-size: 14px; font-weight: 500">Everything</button>
    </div>
    <label for="avoid" style="font-size: 13px; color: #575A54; padding-top: 6px">Allergies or foods to avoid</label>
    <input id="avoid" class="field" placeholder="Optional" style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #D3D4CE; background: #FBFBF9; padding: 0 14px; font: inherit; font-size: 16px; color: #121311">
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px">
    <a href="PantryScan.dc.html" style="height: 56px; border-radius: 28px; background: #121311; color: #F2F2EE; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Continue</a>
    <a href="Targets.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: #575A54">Work these out for me</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
