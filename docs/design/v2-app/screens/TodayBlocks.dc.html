<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today, color blocks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#16142B;text-decoration:none}a:hover{color:#3340FF}
.disp{font-family:'Bricolage Grotesque','Arial Black',sans-serif;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cmd::placeholder{color:#6B6886}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #3340FF;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 0 16px; display: flex; flex-direction: column; gap: 12px; background: #F5F4FF; color: #16142B; font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif">

  <header style="height: 64px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 4px">
    <h1 class="disp" style="flex: 1; margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.03em">Today</h1>
    <span style="height: 36px; padding: 0 14px; border-radius: 18px; background: #E6E3FF; display: flex; align-items: center; font-size: 14px; font-weight: 600">Sat 24</span>
    <a href="Settings.dc.html" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 22px; background: #16142B; color: #F5F4FF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">R</a>
  </header>

  <section aria-label="Calories" style="height: 236px; flex: none; box-sizing: border-box; padding: 20px 22px 22px; border-radius: 32px; background: #3340FF; color: #FFFFFF; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 15px; font-weight: 600">Calories</span>
      <span style="height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(255,255,255,.18); display: flex; align-items: center; font-size: 13px; font-weight: 600">13.5 banked</span>
    </div>
    <span class="disp" style="font-size: 124px; font-weight: 800; letter-spacing: -0.05em; line-height: 0.95; margin-top: 4px">759</span>
    <span style="font-size: 16px; font-weight: 500">left of 1,700</span>
    <div role="img" aria-label="941 of 1,700 eaten" style="margin-top: auto; height: 16px; border-radius: 8px; background: rgba(255,255,255,.24); display: flex; gap: 3px; overflow: hidden">
      <span style="width: 16%; background: #FFFFFF"></span>
      <span style="width: 39%; background: #FFFFFF"></span>
    </div>
  </section>

  <section aria-label="Macros" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <div style="position: relative; height: 150px; border-radius: 28px; background: #FF6A3D; overflow: hidden">
      <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 56%; background: rgba(22,20,43,.14)"></span>
      <div style="position: relative; height: 100%; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; justify-content: space-between">
        <span style="font-size: 14px; font-weight: 600">Protein</span>
        <span style="display: flex; flex-direction: column"><span class="disp" style="font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1">73g</span><span style="font-size: 13px; font-weight: 500">to go</span></span>
      </div>
    </div>
    <div style="position: relative; height: 150px; border-radius: 28px; background: #FFD84D; overflow: hidden">
      <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 45%; background: rgba(22,20,43,.1)"></span>
      <div style="position: relative; height: 100%; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; justify-content: space-between">
        <span style="font-size: 14px; font-weight: 600">Net carbs</span>
        <span style="display: flex; flex-direction: column"><span class="disp" style="font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1">86g</span><span style="font-size: 13px; font-weight: 500">to go</span></span>
      </div>
    </div>
    <div style="position: relative; height: 150px; border-radius: 28px; background: #CDBFFF; overflow: hidden">
      <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 71%; background: rgba(22,20,43,.12)"></span>
      <div style="position: relative; height: 100%; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; justify-content: space-between">
        <span style="font-size: 14px; font-weight: 600">Fat</span>
        <span style="display: flex; flex-direction: column"><span class="disp" style="font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1">13g</span><span style="font-size: 13px; font-weight: 500">to go</span></span>
      </div>
    </div>
  </section>

  <section aria-label="Eaten today" style="display: flex; flex-direction: column; gap: 8px; padding-top: 8px">
    <h2 class="disp" style="margin: 0 4px 2px; font-size: 20px; font-weight: 700">Eaten</h2>
    <a href="EntryDetail.dc.html" style="height: 72px; box-sizing: border-box; padding: 0 18px 0 12px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; gap: 12px">
      <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #E6E3FF; display: flex; align-items: center; font-size: 12px; font-weight: 600">Breakfast</span>
      <span style="flex: 1; min-width: 0; font-size: 16px; font-weight: 600">Standard breakfast</span>
      <span class="disp" style="font-size: 22px; font-weight: 700">272</span>
    </a>
    <a href="EntryDetail.dc.html" style="height: 72px; box-sizing: border-box; padding: 0 18px 0 12px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; gap: 12px">
      <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #E6E3FF; display: flex; align-items: center; font-size: 12px; font-weight: 600">Lunch</span>
      <span style="flex: 1; min-width: 0; font-size: 16px; font-weight: 600">Nachos</span>
      <span class="disp" style="font-size: 22px; font-weight: 700">669</span>
    </a>
  </section>

  <form style="position: absolute; left: 12px; right: 12px; bottom: 16px; height: 68px; border-radius: 34px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; padding: 0 8px; box-shadow: 0 12px 32px rgba(51,64,255,.22)">
    <a href="LabelScan.dc.html" aria-label="Photograph a label or a meal" style="flex: none; width: 52px; height: 52px; border-radius: 26px; background: #E6E3FF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5h3.2l1.8-2.5h7l1.8 2.5h3.2v10h-17z"></path><circle cx="12" cy="13.2" r="3.4"></circle></svg>
    </a>
    <label for="cmd-blocks" class="sr">Log or ask</label>
    <input id="cmd-blocks" class="cmd" placeholder="Tell me what you ate" autocomplete="off" style="flex: 1; min-width: 0; height: 52px; border: 0; background: transparent; color: #16142B; font: inherit; font-size: 16px; font-weight: 500">
    <a href="Listening.dc.html" aria-label="Talk to log or ask" style="flex: none; width: 56px; height: 56px; border-radius: 28px; background: #3340FF; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11.5" rx="3"></rect><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"></path></svg>
    </a>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
